name: Publikacja Kalon - wersja testowa

on:
  push:
    branches: [dev-mode]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: karcianka-test-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pobierz najnowsze Kalon dev-mode
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git ls-remote https://github.com/The-RozU/Karcianka.git refs/heads/dev-mode | cut -f1)"
          test -n "${SOURCE_SHA}"
          curl -fL --retry 3 "https://github.com/The-RozU/Karcianka/archive/${SOURCE_SHA}.zip" -o /tmp/kalon-dev.zip
          mkdir -p /tmp/kalon-dev public public/dev
          unzip -q /tmp/kalon-dev.zip -d /tmp/kalon-dev
          SOURCE_DIR="$(find /tmp/kalon-dev -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "${SOURCE_DIR}"
          cp -a "${SOURCE_DIR}/." public/
          cp -a "${SOURCE_DIR}/." public/dev/
          touch public/.nojekyll
          printf '%s\n' "${SOURCE_SHA}" > public/dev-source-sha.txt

          test -f public/index.html
          test -f public/dev/index.html
          test -f public/maze-generator.js
          test -f public/game.js
          cmp public/index.html public/dev/index.html
          VERSION="$(sed -n 's@.*<title>Kalon.*v\(0\.[0-9]*\.[0-9]*\)</title>.*@\1@p' public/index.html | head -n 1)"
          test -n "${VERSION}"
          grep -Fq "style.css?v=${VERSION}" public/index.html
          grep -Fq "game.js?v=${VERSION}" public/index.html
          grep -Fq "maze-generator.js?v=${VERSION}" public/index.html
          echo "Przygotowano Kalon v${VERSION}, commit ${SOURCE_SHA}"
      - name: Zachowaj eksperyment labiryntu pod /experiment/
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/The-RozU/Karcianka/archive/refs/heads/experiment/labirynt-5x8.zip" -o /tmp/kalon-experiment.zip
          mkdir -p /tmp/kalon-experiment public/experiment
          unzip -q /tmp/kalon-experiment.zip -d /tmp/kalon-experiment
          SOURCE_DIR="$(find /tmp/kalon-experiment -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "${SOURCE_DIR}"
          cp -a "${SOURCE_DIR}/." public/experiment/
          test -f public/experiment/index.html
      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5
      - name: Przygotuj pliki do publikacji
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          # Kazda ponowiona proba musi miec wlasna nazwe artefaktu.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Opublikuj wersję testową
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
