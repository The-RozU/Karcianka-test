name: Publikacja Karcianka-test

on:
  push:
    branches: [dev-mode]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: karcianka-test-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz eksperymentalna wersje gry
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/The-RozU/Karcianka/archive/refs/heads/experiment/labirynt-5x8.zip" -o /tmp/labirynt.zip
          unzip -q /tmp/labirynt.zip -d /tmp/labirynt-src
          mkdir -p public
          cp -a /tmp/labirynt-src/Karcianka-experiment-labirynt-5x8/. public/
          touch public/.nojekyll
          test -f public/index.html
          test -f public/maze-generator.js
      - name: Pobierz zintegrowana wersje dev-mode do osobnego podgladu
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/The-RozU/Karcianka/archive/refs/heads/dev-mode.zip" -o /tmp/dev-mode.zip
          unzip -q /tmp/dev-mode.zip -d /tmp/dev-mode-src
          mkdir -p public/dev
          cp -a /tmp/dev-mode-src/Karcianka-dev-mode/. public/dev/
          test -f public/dev/index.html
          test -f public/dev/maze-generator.js
          test -f public/dev/tests/maze.test.js
          test ! -f public/dev/map-generator.js
          grep -Fq '<title>Kalon' public/dev/index.html
          grep -Fq 'v0.4.0' public/dev/index.html
          grep -Fq 'style.css?v=0.4.0' public/dev/index.html
          grep -Fq 'game.js?v=0.4.0' public/dev/index.html
          grep -Fq 'height: min(41%, 305px)' public/dev/style.css
          grep -Fq 'overflow-y: auto;' public/dev/style.css
          grep -Fq "poker: { name: 'Poker', baseChips: 100, mult: 4.5 }" public/dev/game.js
          grep -Fq "pair: { name: 'Para', baseChips: 10, mult: 1.5 }" public/dev/game.js
      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5
      - name: Przygotuj pliki do publikacji
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Opublikuj gre testowa
        id: deployment
        uses: actions/deploy-pages@v4
